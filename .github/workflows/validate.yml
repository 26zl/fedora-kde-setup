name: Validate Configs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"  # weekly, catches upstream package renames

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate config files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check no hardcoded private IPs in configs
        run: |
          if grep -rE '(192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+)' \
            --include="*.conf" --include="*.toml" --include="*.sh" --include="*.desktop" .; then
            echo "WARNING: Hardcoded private IP found — remove before committing"
            exit 1
          fi
          echo "No hardcoded IPs found."

      - name: Validate TOML files
        run: |
          for f in $(find . -name "*.toml" -not -path "./.git/*"); do
            echo "Validating $f"
            python3 -c "import tomllib; tomllib.load(open('$f','rb'))" && echo "  OK" || exit 1
          done

      - name: Validate XML files
        run: |
          for f in $(find . -name "*.xml" -not -path "./.git/*"); do
            echo "Validating $f"
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')" && echo "  OK" || exit 1
          done

      - name: Validate udev rules
        run: |
          udevadm verify --no-style system/*.rules
          for f in system/*.rules; do
            if grep -q 'TAG+="uaccess"' "$f" && [[ $(basename "$f") > 73-seat-late.rules ]]; then
              echo "uaccess must be assigned before 73-seat-late.rules: $f"
              exit 1
            fi
          done

      - name: Check shell scripts are executable-safe
        run: |
          for f in scripts/*.sh scripts/lib/*.sh tests/*.sh system/*.sh; do
            bash -n "$f" && echo "$f: syntax OK" || exit 1
          done

      - name: Every script answers --help without side effects
        run: |
          for f in scripts/*.sh; do
            case $f in scripts/hwstat.sh) continue ;; esac  # hwstat takes a reading, not --help
            bash "$f" --help >/dev/null || { echo "FAIL: $f --help exited non-zero"; exit 1; }
          done
          echo "all --help OK"

      - name: Run the hardware detection tests
        run: bash tests/hw-detect.sh

      - name: Run the live verification failure-path tests
        run: bash tests/verify-setup.sh

      - name: Run the helper script tests
        run: bash tests/helper-scripts.sh

      - name: Run the user configuration backup tests
        run: bash tests/setup-configs.sh

      - name: Run the sleep lifecycle and NVIDIA storage tests
        run: |
          bash tests/sleep-hooks.sh
          bash tests/nvidia-vram.sh

      - name: Run the emulation installation safety tests
        run: bash tests/emulation-setup.sh

      - name: Run the pre-install restore-point tests
        run: bash tests/setup-restore.sh

      - name: Run the deploy steps on a fresh Fedora
        run: bash tests/fresh-install.sh

      - name: Check every system/ file is deployed by apply-system.sh
        run: |
          missing=0
          for f in system/*; do
            base=$(basename "$f")
            grep -qF "$base" scripts/apply-system.sh || { echo "NOT DEPLOYED by apply-system.sh: $f"; missing=1; }
          done
          exit $missing

  packages:
    name: Check every package the scripts install exists
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add the repos and resolve every package
        run: bash tests/check-packages.sh

  # Same check against the upcoming release. Missing packages are warnings: they show which
  # third-party repos still lag before the upgrade. Any other failure turns the job red,
  # still without blocking merges.
  packages-next:
    name: Check every package on the next Fedora release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    container: registry.fedoraproject.org/fedora:45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add the repos and resolve every package
        run: bash tests/check-packages.sh warning
