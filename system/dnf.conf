# see `man dnf.conf` for defaults and possible options

[main]
gpgcheck=1
installonly_limit=2
clean_requirements_on_remove=True
best=False
# an unreachable repo stops dnf instead of silently skipping its updates; fedora-upgrade.sh relaxes this
skip_if_unavailable=False
fastestmirror=True
max_parallel_downloads=10
