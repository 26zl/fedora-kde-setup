vm.swappiness=180
# zram is RAM-fast, not rotational: read one page at a time, no readahead
vm.page-cluster=0
vm.max_map_count=2147483642
net.core.rmem_max=16777216
net.core.wmem_max=16777216
vm.compaction_proactiveness=0
vm.page_lock_unfairness=1
fs.inotify.max_user_instances=512
# Mode 1 restricts kernel addresses while preserving privileged perf/BPF symbol resolution.
kernel.kptr_restrict=1
kernel.dmesg_restrict=1
net.core.bpf_jit_harden=2
fs.protected_fifos=2
fs.protected_regular=2
# Suppress setuid core dumps even for privileged readers.
fs.suid_dumpable=0
# drop RFC1337 TIME-WAIT assassination packets
net.ipv4.tcp_rfc1337=1
fs.protected_symlinks=1
fs.protected_hardlinks=1
net.ipv4.tcp_syncookies=1
# Workstation routing does not require ICMP redirects or source routing.
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.default.secure_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv6.conf.all.accept_source_route=0
# prefer IPv6 privacy (temporary) addresses for outgoing connections
net.ipv6.conf.all.use_tempaddr=2
net.ipv6.conf.default.use_tempaddr=2
dev.tty.ldisc_autoload=0
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1
# anti-spoofing, loose mode: strict (1) drops Mullvad's policy-routed and
# container return traffic, which is asymmetric by design
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
# restrict ptrace to parent-child (blocks same-user process memory scraping; gdb/strace still work under sudo)
kernel.yama.ptrace_scope=1
# Blocking runtime kernel replacement also disables kdump.
kernel.kexec_load_disabled=1
# one-way: unprivileged BPF stays off until reboot (Fedora's 2 lets root re-enable it)
kernel.unprivileged_bpf_disabled=1
# panic after 100 oopses instead of letting an exploit retry indefinitely
kernel.oops_limit=100
# max mmap ASLR entropy for 64-bit processes; compat bits stay default so
# 32-bit games keep their contiguous address space
vm.mmap_rnd_bits=32
