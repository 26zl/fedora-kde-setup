-- Build hardware rows at startup and omit unavailable sensors.
local hwstat = os.getenv('HOME') .. '/scripts/hwstat.sh'

local function read_line(cmd)
    local pipe = io.popen(cmd .. ' 2>/dev/null')
    if not pipe then return '' end
    local line = pipe:read('*l') or ''
    pipe:close()
    return line
end

local function read_file(path)
    local f = io.open(path)
    if not f then return nil end
    local line = f:read('*l')
    f:close()
    return line
end

local function cpu_name()
    local name = ''
    for line in io.lines('/proc/cpuinfo') do
        local value = line:match('^model name%s*:%s*(.*)$')
        if value then
            name = value
            break
        end
    end
    -- "AMD Ryzen 7 5800X 8-Core Processor" -> "Ryzen 7 5800X", "Intel(R) Core(TM) i5-1235U" -> "Core i5-1235U"
    return (name:gsub('%(R%)', ''):gsub('%(TM%)', ''):gsub(' CPU @.*$', ''):gsub('^.*AMD ', '')
        :gsub('^.*Intel ', ''):gsub(' %d+%-Core Processor%s*$', ''):gsub(' w/ Radeon.*$', '')
        :gsub(' with Radeon.*$', ''))
end

-- Use one logical CPU per physical core to avoid duplicate SMT rows.
local function core_cpus()
    local cpus, seen, id = {}, {}, 0
    while true do
        local topology = string.format('/sys/devices/system/cpu/cpu%d/topology/', id)
        local core = read_file(topology .. 'core_id')
        if not core then break end
        local key = (read_file(topology .. 'physical_package_id') or '0') .. ':' .. core
        if not seen[key] then
            seen[key] = true
            cpus[#cpus + 1] = id + 1
        end
        id = id + 1
    end
    if #cpus == 0 then
        for line in io.lines('/proc/cpuinfo') do
            if line:match('^processor%s*:') then cpus[#cpus + 1] = #cpus + 1 end
        end
    end
    return cpus
end

local text = {}
local function add(...)
    for _, line in ipairs({ ... }) do
        text[#text + 1] = line
    end
end

local function row(label, value)
    return string.format('${color0}  %-6s ${color4}%s', label, value)
end

add('${color2}${font JetBrainsMono Nerd Font:size=32}${time %H:%M}${font}',
    "${color0}${execi 60 LANG=C date '+%A, %d %B %Y'}",
    '',
    '${color0}SYSTEM',
    '${color4}  ${kernel}',
    '${color4}  uptime ${uptime}',
    '')

add('${color0}CPU  ${color4}' .. cpu_name(),
    '${color0}  load   ${color4}${cpu cpu0}%  ${color0}freq  ${color4}${freq_g}GHz')
if read_line(hwstat .. ' cpu-temp') ~= '' then
    add(row('temp', '${execi 2 ' .. hwstat .. ' cpu-temp}'))
end
local cores = core_cpus()
local shown = math.min(#cores, 16)
for first = 1, shown, 4 do
    local last = math.min(first + 3, shown)
    local cells = {}
    for i = first, last do
        cells[#cells + 1] = '${cpu cpu' .. cores[i] .. '}%'
    end
    add(row(first .. '-' .. last, table.concat(cells, ' ')))
end
add('')

local gpu_name = read_line(hwstat .. ' gpu-name')
if gpu_name ~= '' then
    add('${color0}GPU  ${color4}' .. gpu_name)
    for _, field in ipairs({ 'temp', 'load', 'vram' }) do
        if read_line(hwstat .. ' gpu-' .. field) ~= '' then
            add(row(field, '${execi 2 ' .. hwstat .. ' gpu-' .. field .. '}'))
        end
    end
    add('')
end

add('${color0}MEMORY',
    '${color0}  ram    ${color4}${mem} / ${memmax}',
    '${color3}${membar 4,260}',
    '${color0}  zram   ${color4}${swap} / ${swapmax}',
    '',
    '${color0}DISK',
    '${color0}  root   ${color4}${fs_used /} / ${fs_size /}',
    '${color3}${fs_bar 4,260 /}')
for line in io.lines('/proc/mounts') do
    local device, dir = line:match('^(%S+)%s+(%S+)')
    local label = dir and dir:match('^/mnt/([^/\\]+)$')
    if label and device:match('^/dev/') then
        add(row(label, '${fs_used ' .. dir .. '} / ${fs_size ' .. dir .. '}'))
    end
end

add('',
    '${color0}NETWORK',
    '${color0}  ip     ${color4}${eval $${addr ${gw_iface}}}',
    '${color0}  down   ${color1}${eval $${downspeed ${gw_iface}}}   ${color0}up   ${color1}${eval $${upspeed ${gw_iface}}}',
    '',
    '${color0}PROCESSES  ${color4}${running_processes}/${processes}',
    '  ${color4}${top name 1} ${color1}${top cpu 1}%',
    '  ${color4}${top name 2} ${color1}${top cpu 2}%',
    '  ${color4}${top name 3} ${color1}${top cpu 3}%')

conky.text = table.concat(text, '\n')
