-- The second screen when KWin reports one, otherwise the only screen.
local function screen_count()
    local pipe = io.popen('kscreen-doctor -j 2>/dev/null')
    if not pipe then return 1 end
    local json = pipe:read('*a') or ''
    pipe:close()
    local n = 0
    for _ in json:gmatch('"enabled"%s*:%s*true') do n = n + 1 end
    return n
end

